$kind: http-request
url: "{{base_url}}/api/v1/bukus/{{buku_id}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('Detail buku tersedia', () => pm.response.to.have.status(200));
      pm.test('Kategori dan riwayat disertakan', () => { const body = pm.response.json().data; pm.expect(body).to.have.property('kategori'); pm.expect(body).to.have.property('riwayat_peminjaman'); });
    language: text/javascript
order: 6000
