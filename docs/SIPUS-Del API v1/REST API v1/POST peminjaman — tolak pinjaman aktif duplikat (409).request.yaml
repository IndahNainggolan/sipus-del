$kind: http-request
url: "{{base_url}}/api/v1/peminjamans"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "buku_id": {{buku_id}},
      "nim_peminjam": "{{nim}}",
      "nama_peminjam": "Mahasiswa Uji API",
      "durasi_hari": 7
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Pinjaman aktif duplikat ditolak', () => pm.response.to.have.status(409));
      pm.test('Format error RFC 7807', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json'));
    language: text/javascript
order: 11000
