$kind: http-request
url: "{{base_url}}/api/v1/peminjamans/{{peminjaman_id}}/kembalikan"
method: PATCH
headers:
  Authorization: Bearer {{token}}
scripts:
  - type: afterResponse
    code: |-
      pm.test('Pengembalian berhasil', () => pm.response.to.have.status(200));
      pm.test('Link pengembalian dihapus setelah status berubah', () => pm.expect(pm.response.json().data._links).not.to.have.property('kembalikan_buku'));
    language: text/javascript
order: 15000
