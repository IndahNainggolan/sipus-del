$kind: http-request
url: "{{base_url}}/api/v1/peminjamans"
method: POST
headers:
  Authorization: Bearer {{token}}
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "buku_id": {{buku_stok_habis_id}},
      "nim_peminjam": "12S24999",
      "nama_peminjam": "Mahasiswa Uji Stok",
      "durasi_hari": 7
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Stok habis ditolak dengan 422', () => pm.response.to.have.status(422));
      pm.test('Format error RFC 7807', () => pm.expect(pm.response.headers.get('Content-Type')).to.include('application/problem+json'));
    language: text/javascript
order: 12000
